[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-email-sender"
dynamic = ["version"]
description = "A Python package for sending emails using Gmail SMTP"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Antonio Costa", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Email",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/antoniocostabr/email-sender"
Repository = "https://github.com/antoniocostabr/email-sender"
"Bug Reports" = "https://github.com/antoniocostabr/email-sender/issues"
Documentation = "https://github.com/antoniocostabr/email-sender#readme"

[tool.setuptools.dynamic]
version = {attr = "email_sender.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["email_sender*"]

[tool.black]
line-length = 88
target-version = ['py37']

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true